<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associar TAG</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/associate-tag.css') }}">
</head>
<body>
    
    <div class="container" id="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Associar <span>TAG</span></h1>
            <p id="remainingText" style="font-family: 'SharpGroteskPETrialBook', sans-serif; font-size: 1.5rem; color: var(--light-color);">Faltam associar <strong id="remainingCount">0</strong> tag(s)</p>
            
            <!-- Input wrapper -->
            <div class="input-wrapper" id="inputWrapper">
                <input type="text" id="tag-input" placeholder="Aproxime a TAG..." autofocus inputmode="none">
            </div>

            <button id="btn-voltar">VOLTAR</button>
            
            <!-- Modal TAG encontrada -->
            <div id="tagModal" class="modal-overlay" style="display: none;">
                <div class="modal-content">
                    <h2>TAG encontrada</h2>
                    <div class="modal-actions">
                        <button id="cancelButton" class="btn btn-secondary">Cancelar</button>
                        <button id="associateButton" class="btn btn-primary">Associar</button>
                    </div>
                </div>
            </div>

            <!-- Modal Progresso -->
            <div id="progressModal" class="modal-overlay" style="display: none;">
                <div class="modal-content" style="text-align: center;">
                    <svg viewBox="0 0 24 24" style="width: 60px; height: 60px; fill: #ffc107; margin-bottom: 15px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <h2 id="progressTitle">Faltam associar X tag(s)</h2>
                    <p>Aproxime a próxima TAG</p>
                </div>
            </div>

            <!-- Modal Sucesso -->
            <div id="successModal" class="modal-overlay" style="display: none;">
                <div class="modal-content" style="text-align: center;">
                    <svg viewBox="0 0 24 24" style="width: 80px; height: 80px; fill: #28a745; margin-bottom: 20px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <h2>Todas as TAGs associadas!</h2>
                    <p>Tudo certo</p>
                </div>
            </div>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
        </div>
    </div>
    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/associate-tag.js') }}"></script>
</body>
</html>
