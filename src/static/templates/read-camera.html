<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/read-camera.css') }}">
    <script src="https://docs.opencv.org/4.7.0/opencv.js" async></script>
    <script src="https://cdn.jsdelivr.net/gh/ColonelParrot/jscanify@master/src/jscanify.min.js"></script>
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Ler <span>CAMERA</span></h1>
            
            <div class="buttons">
                <button id="switchCameraButton" class="camera-control-btn">
                    Mudar Câmera
                </button>

                <button id="backButton" class="camera-control-btn" onclick="window.history.back()">
                    Voltar
                </button>
            </div>

            <div class="camera-container" id="cameraWrapper">
                <video id="cameraVideo" autoplay playsinline></video>
                <canvas id="cameraCanvas"></canvas>
                <button id="captureButton" class="capture-btn"></button>
            </div>
            
            <!-- Modal de Confirmação -->
            <div id="confirmationModal" class="modal-overlay" style="display: none;">
                <div class="modal-content">
                    <h2>A foto da nota ficou boa?</h2>
                    <canvas id="resultCanvas"></canvas>
                    <div class="modal-actions">
                        <button id="retakeButton" class="btn btn-secondary">Tentar Novamente</button>
                        <button id="confirmButton" class="btn btn-primary">Ficou Boa (Salvar)</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
        </div>
    </div>
    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/read-camera.js') }}"></script>
</body>
</html>
