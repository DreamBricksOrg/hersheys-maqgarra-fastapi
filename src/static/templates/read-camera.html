<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/read-camera.css') }}">
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Ler <span>CÂMERA</span></h1>
            
            <div class="buttons">
                <button id="backButton" onclick="window.history.back()">
                    Voltar
                </button>
                <button id="openCameraBtn">Abrir câmera</button>
                <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">
            </div>

            <!-- Modal de Loading -->
            <div id="loadingModal" class="modal-overlay" style="display: none;">
                <div class="modal-content" style="min-width: 300px; padding: 40px;">
                    <div class="spinner"></div>
                    <h2>Processando Imagem...</h2>
                </div>
            </div>
            
            <!-- Modal de Confirmação -->
            <div id="confirmationModal" class="modal-overlay" style="display: none;">
                <div class="modal-content">
                    <h2>A foto da nota ficou boa?</h2>
                    <img id="previewImage" src="" alt="Nota Processada">
                    <div class="modal-actions">
                        <button id="retakeButton" class="btn btn-secondary">Tirar Novamente</button>
                        <button id="confirmButton" class="btn btn-primary">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
        </div>
    </div>

    <!-- Modal de Resultado NFC-e -->
    <div id="resultModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Nota Fiscal Encontrada</h2>
            <div id="nfceResult" class="nfce-result"></div>
            <div class="modal-actions">
                <button id="closeResultModalBtn" class="btn btn-secondary">Fechar</button>
                <button id="addBarrasBtn" class="btn btn-primary">Adicionar Barras</button>
            </div>
        </div>
    </div>

    <div id="errorModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <svg viewBox="0 0 24 24" style="width: 70px; height: 70px; fill: #dc3545; margin-bottom: 15px;">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <h2 id="errorTitle">Erro ao ler nota</h2>
            <p id="errorSubtitle" style="color: #666; margin: 8px 0 16px; font-size: 14px; display: none;"></p>
            
            <div id="errorDefaultActions" class="modal-actions">
                <button id="retryBtn" class="btn btn-secondary">Tentar Novamente</button>
            </div>

            <div id="errorDuplicateActions" class="modal-actions" style="display: none;">
                <button id="dismissBtn" class="btn btn-secondary">Fechar</button>
            </div>

            <div class="modal-actions" style="margin-top: 10px;">
                <button id="addManualBtn" class="btn btn-primary" style="background-color: var(--chocolate-color); width: 100%;">Adicionar Manualmente</button>
            </div>
        </div>
    </div>

    <!-- Modal de Nota Inválida -->
    <div id="invalidModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <svg viewBox="0 0 24 24" style="width: 70px; height: 70px; fill: #ffc107; margin-bottom: 15px;">
                <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>
            <h2>Nota inválida</h2>
            <p style="color: #666; margin: 8px 0 16px; font-size: 14px;">Esta nota não possui produtos válidos para a promoção ou não pôde ser validada.</p>
            <div class="modal-actions">
                <button id="invalidOkBtn" class="btn btn-primary">Entendido</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/read-camera.js') }}"></script>
</body>
</html>
