<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/read-camera.css') }}">
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Ler <span>CAMERA</span></h1>
            
            <div class="buttons">
                <button id="backButton" onclick="window.history.back()">
                    Voltar
                </button>
                <button id="openCameraBtn">Abrir câmera</button>
                <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">
            </div>

            <!-- Modal de Loading -->
            <div id="loadingModal" class="modal-overlay" style="display: none;">
                <div class="modal-content" style="min-width: 300px; padding: 40px;">
                    <div class="spinner"></div>
                    <h2>Processando Imagem...</h2>
                </div>
            </div>
            
            <!-- Modal de Confirmação -->
            <div id="confirmationModal" class="modal-overlay" style="display: none;">
                <div class="modal-content">
                    <h2>A foto da nota ficou boa?</h2>
                    <img id="previewImage" src="" alt="Nota Processada">
                    <div class="modal-actions">
                        <button id="retakeButton" class="btn btn-secondary">Tentar Novamente</button>
                        <button id="confirmButton" class="btn btn-primary">Ficou Boa (Salvar)</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
        </div>
    </div>

    <!-- Modal de Resultado NFC-e -->
    <div id="resultModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Nota Fiscal Encontrada</h2>
            <div id="nfceResult" class="nfce-result"></div>
            <div class="modal-actions">
                <button id="closeResultModalBtn" class="btn btn-secondary">Fechar</button>
                <button id="addBarrasBtn" class="btn btn-primary">Adicionar Barras</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/read-camera.js') }}"></script>
</body>
</html>
