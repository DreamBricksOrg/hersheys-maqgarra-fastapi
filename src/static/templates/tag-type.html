<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/tag-type.css') }}">
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="buttons" id="buttonsContainer">
                <button id="tag-virtual">Tag Virtual</button>
                <button id="tag-fisica">Tag Fisica</button>
            </div>
            
            <div id="loadingSpinner" style="display: none; justify-content: center; align-items: center; margin-top: 2rem;">
                <div class="loader"></div>
            </div>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
            <img src="{{ url_for('static', path='assets/images/coracao.png') }}" class="footer-coracao" alt="Img 1">
        </div>

        <!-- Modal Confirmação de Tipo de Tag -->
        <div id="confirmTypeModal" class="modal-overlay" style="display: none;">
            <div class="modal-content" style="text-align: center;">
                <svg viewBox="0 0 24 24" style="width: 60px; height: 60px; fill: var(--primary-color); margin-bottom: 15px;">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <h2 id="confirmTypeTitle">Confirmar Tipo</h2>
                <p id="confirmTypeDesc" style="font-family: 'SharpGroteskPETrialBook', sans-serif; font-size: 1.2rem; color: #333; margin-top: 10px;">Você escolheu X. Deseja continuar?</p>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button id="cancelTypeBtn" class="btn btn-secondary">Cancelar</button>
                    <button id="confirmTypeBtn" class="btn btn-primary">Sim, continuar</button>
                </div>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/tag-type.js') }}"></script>
</body>

</html>
