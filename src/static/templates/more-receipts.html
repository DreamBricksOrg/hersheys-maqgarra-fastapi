<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/more-receipts.css') }}">
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Possui mais notas?</h1> 
            <div class="buttons">
                <button id="btn-sim">SIM</button>
                <button id="btn-nao">NÃO</button>
            </div>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
            <img src="{{ url_for('static', path='assets/images/coracao.png') }}" class="footer-coracao" alt="Img 1">
        </div>
    </div>

    <!-- Modal Poxa -->
    <div id="sorryModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <svg viewBox="0 0 24 24" style="width: 70px; height: 70px; fill: #dc3545; margin-bottom: 15px;">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <h2>Poxa, infelizmente você não alcançou a quantidade necessária para conseguir participar</h2>
            <div class="modal-actions" style="margin-top: 20px;">
                <button id="sorryUnderstoodButton" class="btn btn-primary" style="background-color: #dc3545;">Entendido</button>
            </div>
        </div>
    </div>

    <!-- Modal Erro de Sessão -->
    <div id="sessionErrorModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <svg viewBox="0 0 24 24" style="width: 60px; height: 60px; fill: #dc3545; margin-bottom: 15px;">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <h2 id="sessionErrorTitle" style="color: #dc3545;">Erro ao gerar sessão</h2>
            <p id="sessionErrorMessage" style="font-family: 'SharpGroteskPETrialBook', sans-serif; font-size: 1.5rem; color: #333; margin-top: 10px;">Mensagem de erro aqui.</p>
            <div class="modal-actions" style="margin-top: 20px;">
                <button id="sessionErrorOkButton" class="btn btn-primary" style="background-color: #dc3545;">Tentar novamente</button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação de Notas -->
    <div id="confirmReceiptsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <svg viewBox="0 0 24 24" style="width: 70px; height: 70px; fill: #28a745; margin-bottom: 15px;">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
            <h2>Confirmar Notas</h2>
            <p style="color: #666; margin: 8px 0 16px; font-size: 1.1rem; font-family: 'SharpGroteskPETrialBook', sans-serif;">
                Você cadastrou <span id="confirm-receipts-count" style="font-weight: bold; color: var(--chocolate-color);">0</span> nota(s).<br>
                Deseja prosseguir com o cadastro?
            </p>
            <div class="modal-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button id="cancelConfirmBtn" class="btn btn-secondary" style="flex: 1;">Cancelar</button>
                <button id="proceedConfirmBtn" class="btn btn-primary" style="flex: 1; background-color: #28a745;">Confirmar</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/more-receipts.js') }}"></script>
</body>
</html>
