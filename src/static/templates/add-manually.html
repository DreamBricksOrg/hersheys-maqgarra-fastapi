<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/add-manually.css') }}">
    <script src="https://docs.opencv.org/4.7.0/opencv.js" async></script>
    <script src="https://cdn.jsdelivr.net/gh/ColonelParrot/jscanify@master/src/jscanify.min.js"></script>
</head>
<body>
    
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Adicionar <span>Manualmente</span></h1> 
            <input type="number" id="qrcode-input" oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);" min="1" max="99">
            <button id="openCameraBtn" class="btn">Abrir câmera</button>
        </div>
        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
            <img src="{{ url_for('static', path='assets/images/coracao.png') }}" class="footer-coracao" alt="Img 1">
        </div>
    </div>

    <!-- Modal da Câmera (fundo escuro + scanner JScanify) -->
    <div id="cameraModal" class="modal-overlay" style="display: none;">
        <div class="modal-camera-content">
            <div class="camera-container" id="cameraWrapper">
                <video id="cameraVideo" autoplay playsinline></video>
                <canvas id="cameraCanvas"></canvas>
                <button id="captureButton" class="capture-btn"></button>
            </div>
            <button id="closeCameraBtn" class="camera-control-btn">Fechar Câmera</button>
        </div>
    </div>

    <!-- Modal de Confirmação da Foto -->
    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal-confirm-content">
            <h2>A foto da nota ficou boa?</h2>
            <canvas id="resultCanvas"></canvas>
            <div class="modal-actions">
                <button id="retakeButton" class="btn btn-secondary">Tirar Outra</button>
                <button id="sendButton" class="btn btn-primary">Enviar nota e Adicionar barras</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/add-manually.js') }}"></script>
</body>
</html>
