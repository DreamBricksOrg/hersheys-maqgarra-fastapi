<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/root.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='assets/css/scan-qrcode.css') }}">
</head>
<body>
    
    <div class="container" id="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="{{ url_for('static', path='assets/images/titulo.png') }}" width="100%" alt="Logo">
                </div>
                <div class="counter-container">
                    <div class="bars-counter">
                        <h1>BARRAS</h1>
                        <h1 id="barrasCount">0</h1>
                    </div>
                    <div class="separator"></div>
                    <div class="tags-counter">
                        <h1>TAGS</h1>
                        <h1 id="tagsCount">0</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>Ler <span>QR </span>CODE</h1>

            <!-- Input + spinner wrapper -->
            <div class="input-wrapper" id="inputWrapper">
                <input type="text" id="qrcode-input" placeholder="Escaneie o QR Code..." autofocus inputmode="none">
                <div class="input-spinner" id="inputSpinner" style="display: none;">
                    <div class="spinner"></div>
                    <p>Processando nota...</p>
                </div>
            </div>

            <button id="btn-voltar">VOLTAR</button>
        </div>

        <!-- Modal de Resultado -->
        <div id="resultModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h2>Nota Fiscal Encontrada</h2>
                <div id="nfceResult" class="nfce-result"></div>
                <div class="modal-actions">
                    <button id="closeModalBtn" class="btn btn-secondary">Fechar</button>
                    <button id="addBarrasBtn" class="btn btn-primary">Adicionar Barras</button>
                </div>
            </div>
        </div>

        <!-- Modal de Erro -->
        <div id="errorModal" class="modal-overlay" style="display: none;">
            <div class="modal-content" style="text-align: center;">
                <svg viewBox="0 0 24 24" style="width: 70px; height: 70px; fill: #dc3545; margin-bottom: 15px;">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <h2>Erro ao ler nota</h2>
                <div class="modal-actions">
                    <button id="retryBtn" class="btn btn-secondary">Tentar Novamente</button>
                    <button id="addManualBtn" class="btn btn-primary">Adicionar Manual</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <img src="{{ url_for('static', path='assets/images/capivara.png') }}" class="footer-capivara" alt="Img 2">
            <img src="{{ url_for('static', path='assets/images/coracao.png') }}" class="footer-coracao" alt="Img 1">
        </div>
    </div>
    <script src="{{ url_for('static', path='assets/js/counter.js') }}"></script>
    <script src="{{ url_for('static', path='assets/js/scan-qrcode.js') }}"></script>
</body>
</html>
