<html lang="pt-br">
<link rel="stylesheet" href="/src/static/css/tag_validation.css" />
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="/src/static/js/tag_validation.js"></script>

<body>
    <header>
        <img src="/src/static/images/logo_capi.png" alt="" id="logo">
    </header>
    <div id="body-content">
        <span>Passe o QR Code</span>
        <div id="reader_container">
            <div id="reader-border"></div>
            <div id="reader"></div>
        </div>
    </div>
    <img src="/src/static/images/capibarra-mascote-pascoa-hersheys-barra-de-chocolate.webp" alt="" id="capivara">
    <footer>
        <img src="/src/static/images/quadrados_inferiores.png" alt="" id="footer_img">
    </footer>

    <div style="display: none;" id="modal_error">
        <span style="text-align: center;">TAG NAO HABILITADA</span>
    </div>

    <div style="display: none;" id="modal_success">
        <span style="text-align: center;">TAG ESCANEADA COM SUCESSO</span>
    </div>

    <div style="display: none;" id="modal_alert">
        <span style="text-align: center;">ERRO AO ESCANEAR TAG TENTE NOVAMENTE</span>
    </div>
</body>


</html>
